name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MakotoCamera-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # スマホから直接ダウンロードできるように、Releases にも置く(毎回上書き)
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MakotoCamera-test.apk
          gh release delete test --cleanup-tag --yes || true
          gh release create test MakotoCamera-test.apk \
            --target "$GITHUB_SHA" \
            --title "テスト版 (build ${GITHUB_RUN_NUMBER})" \
            --notes "自分用のテスト版です。MakotoCamera-test.apk をスマホでダウンロードしてインストールします。" \
            --prerelease
